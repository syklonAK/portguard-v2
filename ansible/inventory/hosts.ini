# PortGuard Ansible inventory
#
# [portguard_master]  — exactly one host runs the control-plane panel
# [portguard_nodes]   — every other server becomes a managed agent node
# [portguard:children] — group everything for fleet-wide operations

[portguard_master]
master-01 ansible_host=203.0.113.10

[portguard_nodes]
node-ir-01  ansible_host=198.51.100.11 portguard_node_role=iran
node-de-01  ansible_host=198.51.100.12 portguard_node_role=foreign
node-de-02  ansible_host=198.51.100.13 portguard_node_role=generic

[portguard:children]
portguard_master
portguard_nodes

[portguard:vars]
# panel settings
portguard_panel_port: 8080
portguard_repo: https://github.com/syklonAK/portguard-v2

# agent settings (applied to [portguard_nodes])
portguard_agent_port: 8081
portguard_node_role: generic
